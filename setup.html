<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuration — Bar Bot</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0b3d91;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .box {
    background: #0d47a1;
    border-radius: 14px;
    padding: 28px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { opacity: 0.75; font-size: 13px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; margin: 14px 0 6px; opacity: 0.9; }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
  }
  button {
    margin-top: 22px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #ff3b30;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #msg { margin-top: 14px; font-size: 13px; text-align: center; }
  .ok { color: #7CFC00; }
  .err { color: #ffb3b3; }
  .info-box {
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    margin-bottom: 14px;
    border-left: 3px solid #7CFC00;
  }
  .info-box.warn {
    border-left-color: #FFA500;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Configuration du bot</h1>
    <p class="sub">Renseignez le token de votre bot Telegram, votre ID administrateur et l'ID du canal privé.</p>

    <div id="infoBox" class="info-box" style="display:none;"></div>

    <label for="token">Token API du bot</label>
    <input id="token" type="text" placeholder="123456789:AAExxxxxxxxxxxxxxxxxxxxxxxxxxxx">

    <label for="admin">ID Telegram de l'administrateur</label>
    <input id="admin" type="text" placeholder="ex: 987654321">

    <label for="channel">ID du canal privé</label>
    <input id="channel" type="text" placeholder="ex: -1001234567890">

    <button id="save">Enregistrer et démarrer le bot</button>
    <div id="msg"></div>
  </div>

<script>
  const btn = document.getElementById('save');
  const msg = document.getElementById('msg');
  const infoBox = document.getElementById('infoBox');

  // Charger la configuration existante (sans exposer le token)
  async function loadExistingConfig() {
    try {
      const res = await fetch('/api/config-info');
      const data = await res.json();
      if (data.adminId) document.getElementById('admin').value = data.adminId;
      if (data.channelId) document.getElementById('channel').value = data.channelId;
      if (data.hasToken) {
        infoBox.style.display = 'block';
        infoBox.className = 'info-box';
        infoBox.textContent = '✅ Un token est déjà enregistré. Laissez le champ vide pour le conserver, ou saisissez-en un nouveau pour le remplacer.';
      } else {
        infoBox.style.display = 'block';
        infoBox.className = 'info-box warn';
        infoBox.textContent = '⚠️ Aucun token enregistré. Veuillez renseigner tous les champs.';
      }
    } catch (e) {
      infoBox.style.display = 'block';
      infoBox.className = 'info-box warn';
      infoBox.textContent = '⚠️ Impossible de charger la config actuelle.';
    }
  }

  loadExistingConfig();

  btn.addEventListener('click', async () => {
    const BOT_TOKEN = document.getElementById('token').value.trim();
    const ADMIN_ID = document.getElementById('admin').value.trim();
    const CHANNEL_ID = document.getElementById('channel').value.trim();

    if (!ADMIN_ID || !CHANNEL_ID) {
      msg.textContent = 'Merci de remplir au moins l\'ID admin et l\'ID du canal.';
      msg.className = 'err';
      return;
    }

    // Si le token est vide mais qu'on en a déjà un, on laisse le serveur gérer (ou on bloque)
    // Ici on exige un token si le champ est rempli, sinon on peut laisser le serveur décider
    // Pour simplifier, on envoie tout ; le serveur vérifie que BOT_TOKEN est présent
    if (!BOT_TOKEN) {
      msg.textContent = 'Merci de remplir le token API du bot.';
      msg.className = 'err';
      return;
    }

    btn.disabled = true;
    msg.textContent = 'Enregistrement…';
    msg.className = '';

    try {
      const res = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ BOT_TOKEN, ADMIN_ID, CHANNEL_ID })
      });
      const data = await res.json();
      if (res.ok) {
        msg.textContent = "Configuration enregistrée. Le bot est démarré — ajoutez-le à votre canal.";
        msg.className = 'ok';
      } else {
        msg.textContent = data.error || 'Erreur lors de l\'enregistrement.';
        msg.className = 'err';
      }
    } catch (e) {
      msg.textContent = 'Erreur de connexion au serveur.';
      msg.className = 'err';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
